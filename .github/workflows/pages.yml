name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate content and local links
        run: python scripts/validate_project.py
      - name: Smoke test interactive rendering
        run: node scripts/smoke_test.js
      - name: Test diagram logic
        run: node scripts/interaction_test.js
      - name: Test v0.7 child adventure flow
        run: python scripts/v07_content_test.py
      - name: Test v0.8 12-station boss-exam flow
        run: python scripts/v08_content_test.py
      - name: Test A/B midterm/final 100-point exam engine
        run: node scripts/exam_test.js
      - name: Check JavaScript syntax
        run: node --check assets/js/app.js && node --check assets/js/voice.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
