<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五上數學 0.8.0｜版主進度</title><link rel="stylesheet" href="assets/css/app.css?v=0.8.0"><style>
.admin{max-width:1050px;margin:auto;padding:20px}.admin h1{margin-bottom:4px}.note{background:#fff7dc;border:1px solid #ecd79d;border-radius:13px;padding:11px;font-size:11px;line-height:1.7;color:#6f5a28}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:12px 0}.stat{background:#fff;border:1px solid #dfe6f1;border-radius:14px;padding:13px}.stat b{font-size:24px;display:block}.members{display:grid;gap:9px}.member{background:#fff;border:1px solid #dfe6f1;border-radius:15px;padding:13px}.memberTop{display:flex;justify-content:space-between;gap:10px}.memberTop small{color:#77859a}.unitGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}.unitGrid span{font-size:9px;background:#f3f6fa;border-radius:8px;padding:7px;text-align:center}.unitGrid span.done{background:#e9f8f0;color:#1d7354}.adminActions{display:flex;gap:7px;margin:10px 0;flex-wrap:wrap}.adminActions button,.adminActions a{border:1px solid #dce5f2;background:#fff;border-radius:9px;padding:8px 10px;text-decoration:none;color:#53627a;font-size:11px}.memberMetrics{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:9px;color:#68768a}@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.unitGrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="admin"><h1>版主進度｜五上數學 0.8.0</h1><p class="note">目前仍是 GitHub Pages / localStorage 原型：只能看到「這一台瀏覽器」登入過的帳號。GitHub 不會收到學生進度。若未來要讓老師跨裝置查看學生資料，需要另外接雲端後端與權限機制。</p><div class="adminActions"><a href="math.html">← 回學習頁</a><button onclick="exportData()">匯出進度 JSON</button><button onclick="location.reload()">重新整理</button></div><section class="stats"><div class="stat"><small>本機帳號</small><b id="memberN">0</b></div><div class="stat"><small>累積完成站點</small><b id="doneN">0</b></div><div class="stat"><small>累積 XP</small><b id="xpN">0</b></div><div class="stat"><small>累積星星</small><b id="starN">0</b></div><div class="stat"><small>待修錯題</small><b id="mistakeN">0</b></div><div class="stat"><small>已修復錯題</small><b id="fixedN">0</b></div></section><section class="members" id="members"></section></main><script src="assets/js/account.js?v=0.8.0"></script><script>
let UNITS=[];
function unitCorrect(p,uid){return Object.keys(p.correct||{}).filter(k=>k.startsWith(uid+"_")&&p.correct[k]).length}
function stars(p,uid){if(!p.completed?.[uid])return 0;const n=unitCorrect(p,uid);return 1+(n>=3?1:0)+(n>=6?1:0)}
async function render(){UNITS=await fetch("data/units.json").then(r=>r.json());const d=G5Account.read(),arr=Object.values(d.accounts||{});let done=0,xp=0,allStars=0,allMistakes=0,allFixed=0;memberN.textContent=arr.length;members.innerHTML=arr.map(a=>{const p=a.progress?.g5m1||{completed:{},correct:{},xp:0};const n=Object.values(p.completed||{}).filter(Boolean).length,s=UNITS.reduce((sum,u)=>sum+stars(p,u.id),0),badges=UNITS.filter(u=>p.completed?.[u.id]).length,es=p.examScores||{};const mid=['midterm_A','midterm_B'].some(k=>Number(es[k]?.attempts||0)>0),fin=['final_A','final_B'].some(k=>Number(es[k]?.attempts||0)>0),journey=n+(mid?1:0)+(fin?1:0),score=k=>(es[k]?.best??0);const unresolved=Object.keys(p.mistakes||{}).filter(k=>(p.mistakes[k]||0)>0&&!p.correct?.[k]).length;done+=journey;xp+=p.xp||0;allStars+=s;allMistakes+=unresolved;allFixed+=p.fixedMistakes||0;const tiles=[];UNITS.forEach((u,i)=>{const st=stars(p,u.id),station=i<5?i+1:i+2;tiles.push(`<span class="${p.completed?.[u.id]?"done":""}">${station}. ${u.title}<br>${st?"⭐".repeat(st):"—"}</span>`);if(i===4)tiles.push(`<span class="${mid?"done":""}">6. 期中魔王<br>A ${score('midterm_A')||'—'}・B ${score('midterm_B')||'—'}</span>`)});tiles.push(`<span class="${fin?"done":""}">12. 期末魔王<br>A ${score('final_A')||'—'}・B ${score('final_B')||'—'}</span>`);return `<article class="member"><div class="memberTop"><div><b>${a.displayName}</b><small> @${a.id}</small></div><small>Lv.${Math.floor((p.xp||0)/100)+1}｜XP ${p.xp||0}｜${s}⭐</small></div><div class="memberMetrics"><span>完成 ${journey}/12 站</span><span>章節徽章 ${badges}</span><span>期中 A/B ${score('midterm_A')||'—'}/${score('midterm_B')||'—'}</span><span>期末 A/B ${score('final_A')||'—'}/${score('final_B')||'—'}</span><span>最佳連勝 🔥 ${p.comboBest||0}</span><span>待修錯題 🩹 ${unresolved}</span><span>已修復 ${p.fixedMistakes||0}</span></div><div class="unitGrid">${tiles.join("")}</div></article>`}).join("")||"<p>尚無本機帳號進度。</p>";doneN.textContent=done;xpN.textContent=xp;starN.textContent=allStars;mistakeN.textContent=allMistakes;fixedN.textContent=allFixed}
function exportData(){const blob=new Blob([JSON.stringify(G5Account.read(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="grade5-math-v080-progress-backup.json";a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
